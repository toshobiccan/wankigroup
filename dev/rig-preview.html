<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cardslayer rig preview</title>
  <link rel="stylesheet" href="./rig-preview.css" />
</head>
<body>
  <main>
    <p class="eyebrow">Development tool</p>
    <h1>Neutral hero rig</h1>
    <p class="intro">Check the fast run and every future equipment mount before generating final art.</p>
    <section class="panel" aria-label="Rig controls">
      <div class="controls" id="clip-controls">
        <button data-clip="idle">Idle</button>
        <button data-clip="run" class="selected">Run</button>
        <button data-clip="attack">Attack</button>
        <button id="facing">Face left</button>
      </div>
      <div class="slots" id="slot-controls"></div>
    </section>
    <div id="stage" aria-label="Animated skeleton preview"></div>
  </main>
  <script type="module" src="./rig-preview.js"></script>
</body>
</html>
