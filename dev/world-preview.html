<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cardslayer — World Preview (dev only)</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; margin: 0; padding: 16px; }
    #stage { position:relative;overflow:hidden;border:1px solid #887249;width:min(1100px,95vw);height:72vh; }
    #stage.phone {width:390px;max-width:95vw;height:650px;max-height:80vh;}
    .chat-input,.chat-log,.room-label{display:none}
  </style>
</head>
<body>
  <h1>World Preview</h1>
  <p>WASD / arrows or click the ground. E / Space selects then engages; Escape cancels. Touch: slide on the D-pad; A selects/engages and B cancels.</p>
  <button onclick="document.getElementById('stage').classList.toggle('phone');document.getElementById('stage').classList.toggle('preview-touch')">Toggle phone layout + controls</button>
  <div id="stage"></div>
  <p id="movement-status" aria-live="off">Loading world…</p>
  <script type="module" src="./world-preview.js"></script>
</body>
</html>
