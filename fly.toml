# Fly.io deployment -- see docs/DEPLOY.md. The GitHub "Deploy" workflow uses
# this file; nothing here needs changing unless the app name is taken.

app = "cardslayer"          # must be unique across all of Fly.io -- pick another name if this one is taken
primary_region = "arn"      # Stockholm, closest to Norway

[build]                     # uses ./Dockerfile

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/cardslayer.db"
  TRUST_PROXY = "true"
  # ALLOWED_ORIGINS = "https://example.com"   # only if the frontend is ever hosted somewhere else

# SQLite lives on this volume so accounts and progress survive deploys.
[[mounts]]
  source = "cardslayer_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in memory and SQLite on one volume, so this app runs as exactly
  # ONE machine (the deploy uses --ha=false). It sleeps when nobody is connected
  # and wakes on the next visit, which keeps a test server almost free.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
